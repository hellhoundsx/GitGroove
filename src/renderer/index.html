<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gravatar.com https://gravatar.com; font-src 'self' data:"
    />
    <!-- Relative, not absolute: the renderer is served by Vite in dev and opened with `loadFile`
         in production, and only a relative href resolves under both. The file is generated into
         `src/renderer/public/` by `assets/branding/gitgroove-logo.mjs`, which Vite copies next to
         this document at build time. -->
    <link rel="icon" type="image/svg+xml" href="./gitgroove-favicon.svg" />
    <title>GitGroove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
